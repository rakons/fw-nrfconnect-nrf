CONFIG_SENSOR=y
CONFIG_SENSOR_INFO=y

CONFIG_LPS22HH=y

# LPS22 driver uses GPIO
CONFIG_GPIO=y

# Enable UART console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_ASYNC_API=y

# Logger configuration
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_FPU=y
